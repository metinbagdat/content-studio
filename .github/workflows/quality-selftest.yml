name: Quality selftests

on:
  pull_request:
    paths:
      - 'lib/ai/transform.ts'
      - 'lib/ai/transformPrompt.ts'
      - 'lib/quality/**'
      - 'lib/social/telegramChannel.ts'
      - 'lib/social/whatsappNotify.ts'
      - 'lib/social/channelNotify.selftest.ts'
      - '.github/workflows/quality-selftest.yml'
  workflow_dispatch:

jobs:
  prompt-red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx lib/quality/promptRedTeam.selftest.ts
      - run: npx tsx lib/social/channelNotify.selftest.ts
