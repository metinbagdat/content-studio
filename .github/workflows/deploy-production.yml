name: Deploy Content Studio

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/issue-bodies/**'
  workflow_dispatch:

concurrency:
  group: content-studio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.coalesce.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Coalesce rapid main merges
        id: coalesce
        shell: bash
        env:
          DEPLOY_COALESCE_SECONDS: '90'
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_REF: main
        run: bash scripts/vercel-deploy-coalesce.sh

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve Vercel scope
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.CONTENT_STUDIO_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "Missing CONTENT_STUDIO_VERCEL_PROJECT_ID"; exit 1; }
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID" >> "$GITHUB_ENV"
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            echo "VERCEL_ORG_ID=$VERCEL_ORG_ID" >> "$GITHUB_ENV"
            echo "VERCEL_SCOPE=$VERCEL_ORG_ID" >> "$GITHUB_ENV"
          fi

      - name: Validate cron (Hobby)
        run: node scripts/validate-vercel-cron-hobby.js

      - name: Install Vercel CLI
        run: npm install -g vercel@latest --no-audit --no-fund

      - name: Pull Vercel env
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

      - name: Build
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            vercel build --prod --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

      - name: Deploy production
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            vercel deploy --prebuilt --archive=tgz --prod --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel deploy --prebuilt --archive=tgz --prod --token="${{ secrets.VERCEL_TOKEN }}"
          fi
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
